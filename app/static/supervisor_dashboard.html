<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Mavuno Yield — Regional Oversight</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2416; --ink-soft: #2e382a; --muted: #74705f; --muted-soft: #9a9584;
    --bg: #f4efe3; --bg-alt: #ede7d6; --paper: #fbf8ee;
    --line: #d9d2bd; --line-soft: #e6dfc9;
    --accent: #2e4d1f; --accent-soft: #4a6b36; --clay: #a0542c; --gold: #a17b2c; --bad: #8a2f24;
  }
  :root[data-theme="dark"] {
    --ink: #f2ece0; --ink-soft: #d9d3c4; --muted: #8e887c; --muted-soft: #6a6558;
    --bg: #14140f; --bg-alt: #1a1a14; --paper: #1c1b14;
    --line: #2d2b21; --line-soft: #242219;
    --accent: #78a163; --accent-soft: #4a6b36; --clay: #c87a52; --gold: #d4a656; --bad: #d07668;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Inter", sans-serif; font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; display: flex;
  }
  .display { font-family: "Fraunces", serif; }
  
  /* Sidebar */
  .sidebar {
    width: 300px; background: var(--paper); border-right: 1px solid var(--line);
    padding: 32px; display: flex; flex-direction: column; gap: 32px; overflow-y: auto;
  }
  .main { flex: 1; overflow-y: auto; padding: 48px; }
  
  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 0 20px; margin-bottom: 32px; border-bottom: 1px solid var(--line);
  }
  .mast-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 24px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .role-badge {
    background: var(--accent); color: white;
    padding: 4px 12px; border-radius: 999px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* Oversight Cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; margin-bottom: 40px; }
  .stat-card { background: var(--paper); border: 1px solid var(--line); padding: 24px; border-radius: 6px; }
  .stat-card .label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 12px; }
  .stat-card .value { font-family: "Fraunces", serif; font-size: 32px; color: var(--ink); }

  .chat-drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 90vw;
    background: var(--paper); border-left: 1px solid var(--line);
    box-shadow: -8px 0 32px rgba(0,0,0,0.08);
    transform: translateX(100%); transition: transform 0.22s ease; z-index: 2200;
    display: flex; flex-direction: column;
  }
  .chat-drawer.open { transform: translateX(0); }
  .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .chat-close { border: none; background: transparent; font-size: 20px; cursor: pointer; }

  .nav-toggle { display: none; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 20px; align-items: center; justify-content: center; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1900; opacity: 0; pointer-events: none; transition: opacity 200ms; }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  @media (max-width: 1024px) {
    html, body { height: auto; overflow: auto; }
    body { display: block; }
    .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 2000; width: 280px; transform: translateX(-100%); transition: transform 250ms; box-shadow: 10px 0 40px rgba(0,0,0,0.15); }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 20px; min-height: 100vh; }
    .nav-toggle { display: inline-flex; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="stat-card" style="background:var(--bg-alt); border:none;">
    <span class="label">System Health</span>
    <div class="value" style="font-size: 20px; color:var(--accent);">● Optimal</div>
  </div>
  <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
    <a href="/store" style="text-decoration:none; color:var(--ink); font-weight:600; display:block; padding:8px 0;">📡 Hardware Store</a>
    <a href="/feed-page" style="text-decoration:none; color:var(--ink); font-weight:600; display:block; padding:8px 0;">🌱 Mavuno Social</a>
    <a href="#" onclick="openChat(); return false;" style="text-decoration:none; color:var(--ink); font-weight:600; display:block; padding:8px 0;">💬 Messages</a>
    <a href="/logout" style="text-decoration:none; color:var(--bad); font-weight:600; display:block; padding:8px 0;">Sign out</a>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<div class="main">
  <header class="masthead">
    <div class="mast-left">
      <button class="nav-toggle" id="nav-toggle" onclick="openSidebar()">☰</button>
      <a href="/" class="logo display">Mavuno Yield</a>
      <span class="role-badge">Supervisor</span>
    </div>
  </header>

  <h1 class="display" style="font-size:42px;">Governance Dashboard</h1>
  <div class="stats-grid">
    <div class="stat-card"><span class="label">Aggregate YPS</span><div class="value" id="agg-yps">0</div></div>
    <div class="stat-card"><span class="label">Total Trade</span><div class="value" id="total-vol">0 KG</div></div>
  </div>
</div>

<div class="chat-drawer" id="chat-drawer" aria-hidden="true">
  <div class="chat-head">
    <h3 class="display">Messages</h3>
    <button class="chat-close" onclick="closeChat()">×</button>
  </div>
  <div class="chat-body" id="chat-body"></div>
</div>

<script>
function openChat() { document.getElementById("chat-drawer").classList.add("open"); }
function closeChat() { document.getElementById("chat-drawer").classList.remove("open"); }
function openSidebar() { document.querySelector(".sidebar").classList.add("open"); document.getElementById("backdrop").classList.add("open"); }
function closeSidebar() { document.querySelector(".sidebar").classList.remove("open"); document.getElementById("backdrop").classList.remove("open"); }

async function jget(url) {
  const r = await fetch(url);
  if (r.status === 401) { window.location.href = "/"; return; }
  return r.json();
}

async function loadData() {
  const stats = await jget("/supervisor/stats");
  if (stats && !stats.error) {
    document.getElementById("agg-yps").textContent = Math.round(stats.regional_yps.reduce((acc, r) => acc + r.avg_yps, 0) / stats.regional_yps.length);
    document.getElementById("total-vol").textContent = stats.trade_volume.reduce((acc, r) => acc + r.total_kg, 0).toLocaleString() + " KG";
  }
}

document.addEventListener("DOMContentLoaded", () => { loadData(); });
</script>
</body>
</html>
