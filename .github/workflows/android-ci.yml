name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build Debug APKs
        run: cd mobile && ./gradlew assembleDebug

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            mobile/app/build/outputs/apk/debug/*.apk
            mobile/agent-app/build/outputs/apk/debug/*.apk
            mobile/buyer-app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > mobile/keystore/mavuno-release.jks

      - name: Build Release Bundles (AAB)
        run: |
          cd mobile && ./gradlew bundleRelease
        env:
          MAVUNO_RELEASE_STORE_FILE: ../keystore/mavuno-release.jks
          MAVUNO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          MAVUNO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MAVUNO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            mobile/app/build/outputs/bundle/release/*.aab
            mobile/agent-app/build/outputs/bundle/release/*.aab
            mobile/buyer-app/build/outputs/bundle/release/*.aab
