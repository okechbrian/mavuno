<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Sign Up - Mavuno Protocol</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2416; --muted: #74705f; --bg: #f4efe3; --bg-alt: #ede7d6; --paper: #fbf8ee;
    --line: #d9d2bd; --accent: #2e4d1f; --bad: #8a2f24;
  }
  body { background: var(--bg); color: var(--ink); font-family: "Inter", sans-serif; font-size: 13px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
  .display { font-family: "Fraunces", serif; }
  .card { background: var(--paper); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); width: 100%; max-width: 480px; padding: 40px; }
  .tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; font-weight: 600; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg-alt); color: var(--ink); font-family: inherit; font-size: 14px; }
  .btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bad); color: white; padding: 12px 24px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div style="text-align: center; margin-bottom: 32px;">
    <h1 class="display" style="font-size: 32px; margin: 0 0 8px 0;">Join Mavuno</h1>
    <p style="color: var(--muted); margin: 0;">Register as a farmer to access AI tools, or as a buyer to source verified yield.</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('farmer')">Farmer Onboarding</div>
    <div class="tab" onclick="switchTab('buyer')">Institutional Buyer</div>
  </div>

  <div id="form-farmer" class="tab-content active">
    <form onsubmit="handleSignup(event, 'farmer')">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="f-name" required placeholder="E.g., Akello Rose">
      </div>
      <div class="form-group">
        <label>Phone Number (Login ID)</label>
        <input type="tel" id="f-phone" required placeholder="E.g., 256777000111">
      </div>
      <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <label>District</label>
          <input type="text" id="f-district" required placeholder="E.g., Mbale">
        </div>
        <div>
          <label>Primary Crop</label>
          <select id="f-crop" required>
            <option value="coffee">Coffee</option>
            <option value="maize">Maize</option>
            <option value="beans">Beans</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Farm Size (Acres)</label>
        <input type="number" step="0.1" id="f-acres" required placeholder="E.g., 2.5">
      </div>
      <div class="form-group">
        <label>Set 4-Digit PIN</label>
        <input type="password" id="f-pin" required pattern="\d{4}" placeholder="1234">
      </div>
      <button type="submit" class="btn" id="f-btn">Register & Continue to KYC</button>
    </form>
  </div>

  <div id="form-buyer" class="tab-content">
    <form onsubmit="handleSignup(event, 'buyer')">
      <div class="form-group">
        <label>Company / Buyer Name</label>
        <input type="text" id="b-name" required placeholder="E.g., Nile Coffee Exporters">
      </div>
      <div class="form-group">
        <label>Contact Phone</label>
        <input type="tel" id="b-phone" required placeholder="E.g., 256700111222">
      </div>
      <div class="form-group">
        <label>Operating Region</label>
        <input type="text" id="b-region" required placeholder="E.g., Eastern Uganda">
      </div>
      <div class="form-group">
        <label>Set Password</label>
        <input type="password" id="b-pwd" required placeholder="Minimum 6 characters">
      </div>
      <button type="submit" class="btn" id="b-btn">Register as Buyer</button>
    </form>
  </div>
  
  <div style="text-align: center; margin-top: 24px; font-size: 12px;">
    Already have an account? <a href="/" style="color: var(--accent); font-weight: 600;">Sign in here</a>.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function switchTab(type) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('form-' + type).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

async function handleSignup(e, role) {
  e.preventDefault();
  const btn = document.getElementById(role === 'farmer' ? 'f-btn' : 'b-btn');
  btn.disabled = true;
  btn.textContent = 'Registering...';

  let payload = {};
  if (role === 'farmer') {
    payload = {
      role: 'farmer',
      name: document.getElementById('f-name').value,
      phone: document.getElementById('f-phone').value,
      district: document.getElementById('f-district').value,
      crop: document.getElementById('f-crop').value,
      acres: parseFloat(document.getElementById('f-acres').value),
      pin_or_password: document.getElementById('f-pin').value
    };
  } else {
    payload = {
      role: 'buyer',
      name: document.getElementById('b-name').value,
      phone: document.getElementById('b-phone').value,
      region: document.getElementById('b-region').value,
      pin_or_password: document.getElementById('b-pwd').value
    };
  }

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    
    if (res.ok && data.ok) {
      window.location.href = data.redirect;
    } else {
      showToast(data.error || 'Registration failed.');
      btn.disabled = false;
      btn.textContent = role === 'farmer' ? 'Register & Continue to KYC' : 'Register as Buyer';
    }
  } catch (err) {
    showToast('Network error.');
    btn.disabled = false;
    btn.textContent = role === 'farmer' ? 'Register & Continue to KYC' : 'Register as Buyer';
  }
}
</script>
</body>
</html>
